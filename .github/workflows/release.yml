name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign update archive and feed
        shell: bash
        run: |
          if [ -n "$PAPERGLIM_UPDATE_PRIVATE_KEY" ]; then
            npm run release:sign
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo 'No release signing key. Sign locally and publish the ZIP, DMG and appcast together; unsigned updates cannot be published by this workflow.' >&2
            exit 1
          else
            echo 'Built unsigned distribution artifacts for local verification. Sign locally before publishing.'
          fi
        env:
          PAPERGLIM_UPDATE_PRIVATE_KEY: ${{ secrets.PAPERGLIM_UPDATE_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: Pagecove-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/appcast.xml
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Pagecove-mac-arm64
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd artifacts
          sha256sum *.dmg *.zip appcast.xml > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.dmg *.zip appcast.xml SHA256SUMS.txt --verify-tag --title "Pagecove $RELEASE_TAG" --generate-notes --latest
