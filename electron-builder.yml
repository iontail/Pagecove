appId: io.github.iontail.paperglim
productName: Pagecove
directories:
  output: release
afterPack: scripts/configure-updater.cjs
extraResources:
  - from: .cache/PaperGlimUpdater.app
    to: PaperGlimUpdater.app
files:
  - out/**/*
  - resources/ResNet.pdf
  - resources/icon.icns
  - resources/icon.png
  - resources/icon.svg
  - resources/update-public-key.txt
  - package.json
mac:
  icon: resources/icon.icns
  category: public.app-category.education
  minimumSystemVersion: '13.0'
  identity: '-'
  notarize: false
  signIgnore:
    - PaperGlimUpdater\.app
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  artifactName: Pagecove-${version}-mac-${arch}.${ext}
fileAssociations:
  - ext: pdf
    name: PDF document
    mimeType: application/pdf
    role: Viewer
dmg:
  title: Pagecove
  contents:
    - x: 145
      y: 180
    - x: 415
      y: 180
      type: link
      path: /Applications
publish:
  provider: github
  owner: iontail
  repo: Pagecove
